<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
   <!-- Favicon -->
  <link rel="shortcut icon" href="material/logo with bg.png" type="image/x-icon">

  <!-- Bs Cdn Css V 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- dancing script  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">

     <!-- fontawesome cdn  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>404 – Page Not Found</title>
  <style>
    :root {
      --background-color--: #fff8ed;
      --gold: #DEA347;
      --light-purple: #d8a7ff;
      --text-color--: #3b123c;
      --purple: #6f3fa8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-color--);
      background: var(--background-color--);
      overflow: hidden;
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .45;
      z-index: 0;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb.one { width: 340px; height: 340px; background: var(--light-purple); top: -90px; left: -90px; }
    .orb.two { width: 300px; height: 300px; background: var(--gold); bottom: -90px; right: -70px; animation-delay: -6s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.15); }
    }
    main {
      position: relative;
      z-index: 1;
      max-width: 560px;
      background: var(--background-color--);
      border: 2px solid var(--light-purple);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(59, 18, 60, .12);
    }
    .code {
      font-size: clamp(5.5rem, 22vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, var(--purple), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: float 3.5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 12px 0 10px; color: var(--text-color--); }
    p  { color: var(--text-color--); opacity: .75; line-height: 1.6; margin-bottom: 28px; }
    .path {
      display: inline-block;
      max-width: 100%;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .85rem;
      color: var(--purple);
      background: var(--light-purple);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .2s, box-shadow .2s, background .2s, color .2s;
    }
    .btn.primary {
      color: var(--background-color--);
      background: var(--purple);
      box-shadow: 0 8px 22px rgba(111, 63, 168, .3);
    }
    .btn.primary:hover {
      background: var(--text-color--);
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(59, 18, 60, .35);
    }
    .btn.ghost {
      color: var(--purple);
      background: transparent;
      border-color: var(--gold);
    }
    .btn.ghost:hover {
      background: var(--gold);
      color: var(--text-color--);
      transform: translateY(-2px);
    }
    .btn:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .orb, .code { animation: none; }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Oops! Page not found</h1>
    <p>
      The page <span class="path" id="missing-path">you requested</span> doesn't exist,
      may have been moved, or the link is broken.
    </p>
    <div class="actions">
      <a class="btn primary" href="/Seo-Optimization-Website.git>Back to Home</a>
      <a class="btn ghost" href="javascript:history.back()">Go Back</a>
    </div>
  </main>

  <script>
    try {
      document.getElementById("missing-path").textContent = location.pathname;
    } catch (e) {}
  </script>
</body>
</html>
